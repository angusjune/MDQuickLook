name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (Release, ad-hoc signed)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          xcodebuild -project MDQuickLook.xcodeproj \
            -scheme MDQuickLook -configuration Release \
            MARKETING_VERSION="$VER" \
            -derivedDataPath build build
      - name: Zip app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent MDQuickLook.app "MDQuickLook-${GITHUB_REF_NAME}.zip"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/MDQuickLook-*.zip
          generate_release_notes: true
